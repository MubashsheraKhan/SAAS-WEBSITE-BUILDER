<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Log in — Webaura by III</title><link rel="stylesheet" href="/css/tailwind.css"></head><body class="flex min-h-screen items-center justify-center px-5 py-12"><main class="w-full max-w-md rounded-3xl bg-white p-8 shadow-soft"><a href="/" class="text-sm font-bold text-plum-900">← Webaura by III</a><h1 class="mt-8 text-3xl font-bold text-plum-900">Welcome back</h1><p class="mt-2 text-sm text-slate-600">Log in to manage your workspace.</p><form id="auth-form" class="mt-8 space-y-5" data-mode="login"><div><label for="email" class="mb-2 block text-sm font-medium">Email address</label><input class="field" id="email" name="email" type="email" autocomplete="email" required></div><div><label for="password" class="mb-2 block text-sm font-medium">Password</label><input class="field" id="password" name="password" type="password" autocomplete="current-password" minlength="8" required></div><button class="btn-primary w-full" type="submit">Log in</button><button class="w-full text-sm text-iris-700" id="reset-password" type="button">Forgot password?</button><p id="form-message" class="min-h-5 text-sm" role="status" aria-live="polite"></p></form><p class="mt-4 text-center text-sm text-slate-600">New to Webaura? <a class="font-semibold text-iris-700" href="/register.html">Create an account</a></p></main><script type="module" src="/js/pages/auth-page.js"></script></body></html>
