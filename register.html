<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account — Webaura by III</title><link rel="stylesheet" href="/css/tailwind.css"></head><body class="flex min-h-screen items-center justify-center px-5 py-12"><main class="w-full max-w-md rounded-3xl bg-white p-8 shadow-soft"><a href="/" class="text-sm font-bold text-plum-900">← Webaura by III</a><h1 class="mt-8 text-3xl font-bold text-plum-900">Create your account</h1><p class="mt-2 text-sm text-slate-600">Start a workspace for your store, catalogue or service business.</p><form id="auth-form" class="mt-8 space-y-5" data-mode="register"><div><label for="name" class="mb-2 block text-sm font-medium">Your name</label><input class="field" id="name" name="name" type="text" autocomplete="name" maxlength="80" required></div><div><label for="email" class="mb-2 block text-sm font-medium">Email address</label><input class="field" id="email" name="email" type="email" autocomplete="email" required></div><div><label for="password" class="mb-2 block text-sm font-medium">Password</label><input class="field" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><p class="mt-2 text-xs text-slate-500">Use at least 8 characters.</p></div><button class="btn-primary w-full" type="submit">Create account</button><p id="form-message" class="min-h-5 text-sm" role="status" aria-live="polite"></p></form><p class="mt-4 text-center text-sm text-slate-600">Already registered? <a class="font-semibold text-iris-700" href="/login.html">Log in</a></p></main><script type="module" src="/js/pages/auth-page.js"></script></body></html>
