<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Your workspace — Webaura by III</title><link rel="stylesheet" href="/css/tailwind.css"></head><body class="min-h-screen"><header class="flex items-center justify-between border-b border-slate-200 bg-white px-5 py-4"><a href="/" class="font-bold text-plum-900">webaura by III</a><button id="logout" class="btn-secondary">Log out</button></header><main class="mx-auto max-w-5xl px-5 py-10"><p class="text-sm font-semibold text-iris-700">BUSINESS WORKSPACE</p><h1 class="mt-2 text-3xl font-bold text-plum-900">Set up your business</h1><p class="mt-2 text-slate-600">Create a workspace that will eventually manage your website, products, enquiries and orders.</p><section class="mt-8 max-w-xl rounded-2xl border border-slate-200 bg-white p-6 shadow-soft"><form id="business-form" class="space-y-5"><div><label class="mb-2 block text-sm font-medium" for="business-name">Business name</label><input id="business-name" name="name" class="field" required minlength="2" maxlength="100" placeholder="e.g. Aanya Handmade"></div><div><label class="mb-2 block text-sm font-medium" for="business-type">Business type</label><select id="business-type" name="type" class="field" required><option value="">Choose a type</option><option value="ecommerce">Ecommerce store</option><option value="catalogue">Product catalogue / WhatsApp seller</option><option value="service">Service business</option></select></div><button class="btn-primary" type="submit">Create workspace</button><p id="message" class="text-sm" role="status" aria-live="polite"></p></form></section><p class="mt-6 text-xs text-slate-500">Phase 1 onboarding only. Website editing and publishing are not available yet.</p></main><script type="module" src="/js/pages/dashboard.js"></script></body></html>
